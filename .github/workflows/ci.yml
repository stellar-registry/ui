name: Test

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # actions/setup-node's node 22 bundles npm 10.x; bump to match the
      # engines.npm range (see package.json / CLAUDE.md) rather than pin
      # everyone's local npm backward to whatever CI happens to ship with.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
