name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # clients/registry-client is gitignored and generated from the live
      # Registry contract (see environments.toml) — a pure RPC read, so no
      # local identity/signer is needed, just the stellar CLI itself.
      - run:
          curl -LO
          https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
      - run:
          tar xz -C /usr/local/bin -f
          stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz

      - run: npm run generate:registry-client:testnet

      - run: CLOUDFLARE_ENV=testnet npm run build

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: CLOUDFLARE_ENV=stellar npm run build

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
